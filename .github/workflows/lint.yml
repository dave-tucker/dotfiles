name: Lint

on: # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7.0.1

      - name: Install lint tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # @v5.2.10
        with:
          version: 2026.11.5
          cache: true
          mise_toml: |
            [tools]
            actionlint = "1.7.12"
            jq = "1.8.2"
            just = "1.51.0"
            "npm:prettier" = "3.10.1"
            "pipx:pre-commit" = "4.7.0"
            shellcheck = "0.11.0"
            shfmt = "3.14.1"
            taplo = "0.10.0"
            yamllint = "1.38.0"
            yq = "4.54.3"

      - name: Lint managed files
        run: just lint
