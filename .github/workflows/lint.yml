name: Lint

on: # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # @v5

      - name: Install lint tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # @v3
        with:
          version: 2026.11.5
          cache: true
          mise_toml: |
            [tools]
            actionlint = "1.7.12"
            chezmoi = "2.70.1"
            jq = "1.8.2"
            "npm:prettier" = "3.10.1"
            shellcheck = "0.11.0"
            shfmt = "3.14.1"
            taplo = "0.10.0"
            yamllint = "1.38.0"
            yq = "4.54.3"

      - name: Lint managed files
        run: bash scripts/lint.sh
